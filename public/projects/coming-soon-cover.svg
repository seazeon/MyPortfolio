<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">敬请期待</title>
  <desc id="desc">复古电脑屏幕风格的项目占位图片</desc>
  <defs>
    <radialGradient id="screen" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#173d2d"/>
      <stop offset="0.65" stop-color="#071b15"/>
      <stop offset="1" stop-color="#020907"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b4135"/>
      <stop offset="0.5" stop-color="#171d18"/>
      <stop offset="1" stop-color="#080b09"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".18"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#050806"/>
  <rect x="135" y="105" width="1330" height="790" rx="68" fill="url(#frame)" stroke="#77836b" stroke-opacity=".38" stroke-width="5"/>
  <rect x="195" y="160" width="1210" height="650" rx="46" fill="url(#screen)" stroke="#a8bc90" stroke-opacity=".32" stroke-width="4"/>
  <rect x="195" y="160" width="1210" height="650" rx="46" fill="url(#scan)"/>
  <path d="M260 245h1080M260 720h1080" stroke="#91bd7c" stroke-opacity=".16" stroke-width="2"/>
  <g fill="#dcecc8" text-anchor="middle" filter="url(#glow)">
    <text x="800" y="445" font-family="Georgia, 'Noto Serif SC', serif" font-size="112" letter-spacing="22">敬请期待</text>
    <text x="800" y="545" font-family="Arial, sans-serif" font-size="28" letter-spacing="14" opacity=".72">COMING SOON</text>
  </g>
  <g fill="#a9c993" opacity=".65" font-family="monospace" font-size="22">
    <text x="260" y="235">PORTFOLIO_ARCHIVE</text>
    <text x="1110" y="760">STANDBY_</text>
  </g>
  <circle cx="1310" cy="855" r="13" fill="#bada97" filter="url(#glow)"/>
  <circle cx="1355" cy="855" r="13" fill="#53644d"/>
</svg>
